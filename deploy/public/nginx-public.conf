server {
    listen 127.0.0.1:18878;
    server_name commandcore.app www.commandcore.app;
    root /opt/commandcore-public/site;
    index index.html;
    autoindex off;
    server_tokens off;
    client_max_body_size 16m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    location = /app { return 302 /app/; }
    location = /app/ { try_files /app/index.html =404; add_header Cache-Control "no-store" always; }
    location = /app/index.html { add_header Cache-Control "no-store" always; }
    location ~ ^/(main-[A-Za-z0-9]+\.js|styles-[A-Za-z0-9]+\.css|favicon\.ico|commandcore-icon\.png|manifest\.webmanifest)$ { try_files $uri =404; }
    location /brand/ { try_files $uri =404; }
    location /api/ { proxy_pass http://127.0.0.1:8787; proxy_http_version 1.1; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 180s; }
    location /auth/ { proxy_pass http://127.0.0.1:8787; proxy_http_version 1.1; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Real-IP $remote_addr; }
    location /mcp { proxy_pass http://127.0.0.1:8787; proxy_http_version 1.1; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 3600s; proxy_send_timeout 3600s; proxy_buffering off; }
    location /agent { proxy_pass http://127.0.0.1:8787; proxy_http_version 1.1; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto https; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_read_timeout 3600s; proxy_buffering off; }
    location ~ ^/(enroll|install|releases)(/|$) { proxy_pass http://127.0.0.1:8787; proxy_http_version 1.1; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto https; }
    location ^~ /.well-known/ { proxy_pass http://127.0.0.1:8787; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto https; }
    location = /healthz { proxy_pass http://127.0.0.1:8787; }
    location = /openapi.json { return 404; }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { return 404; }
}
