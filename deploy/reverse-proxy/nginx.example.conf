# Example only. Adapt certificate paths and policy to the existing host.
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

upstream commandcore_backend {
  server 127.0.0.1:8787;
}

server {
  listen 443 ssl http2;
  server_name commandcore.example.com;

  # ssl_certificate /existing/path/fullchain.pem;
  # ssl_certificate_key /existing/path/privkey.pem;

  location / {
    proxy_pass http://commandcore_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
  }
}
