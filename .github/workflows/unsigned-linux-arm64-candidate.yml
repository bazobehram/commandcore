name: Unsigned Linux ARM64 Agent review candidate

on:
  workflow_dispatch:
  # A one-time source-pinned build when the reviewed packaging workflow lands.
  # Rebuild after version/package or packaging changes; other commits do not
  # create expensive native candidates. Manual dispatch remains available.
  push:
    branches: [main]
    paths:
      - '.github/workflows/unsigned-linux-arm64-candidate.yml'
      - 'scripts/package_unsigned_native_candidate.py'
      - 'tests/test_package_unsigned_native_candidate.py'
      - 'install/linux.sh'
      - 'apps/server/commandcore_server/distribution.py'
      - 'scripts/prepare_linux_release_review.py'
      - 'VERSION'
      - 'agent/rust/Cargo.toml'
      - 'agent/rust/Cargo.lock'
      - 'agent/rust/src/**'

permissions:
  contents: read

jobs:
  unsigned-linux-candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Validate source identity and package version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import pathlib, tomllib
          root = pathlib.Path(".")
          package = tomllib.loads((root / "agent/rust/Cargo.toml").read_text())
          assert (root / "VERSION").read_text().strip() == package["package"]["version"]
          PY
      - name: Rust toolchain and native locked release build
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          rustc --version
          cargo --version
          cargo test --locked --manifest-path agent/rust/Cargo.toml
          cargo build --locked --release --manifest-path agent/rust/Cargo.toml
      - name: Native Agent black-box core acceptance (ephemeral localhost)
        shell: bash
        env:
          PYTHONPATH: apps/server:agent
          COMMANDCORE_RUST_AGENT_BIN: ${{ github.workspace }}/agent/rust/target/release/commandcore-agent-rust
        run: |
          set -euo pipefail
          python -m pip install -r requirements-dev.txt . ./agent
          python scripts/rust_agent_smoke.py
      - name: Produce and independently verify unsigned build evidence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/package_unsigned_native_candidate.py prepare \
            --binary agent/rust/target/release/commandcore-agent-rust \
            --cargo-lock agent/rust/Cargo.lock \
            --output dist/unsigned-native-agent-candidate \
            --source-sha "$GITHUB_SHA" \
            --architecture arm64 \
            --version "$(cat VERSION)" \
            --rustc-version "$(rustc --version)" \
            --cargo-version "$(cargo --version)"
          python scripts/package_unsigned_native_candidate.py verify \
            --output dist/unsigned-native-agent-candidate \
            --source-sha "$GITHUB_SHA" \
            --architecture arm64
      - name: Attest exact native binary and build metadata
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/unsigned-native-agent-candidate/commandcore-agent-linux-arm64
            dist/unsigned-native-agent-candidate/UNSIGNED_BUILD_METADATA.json
          create-storage-record: false
      - name: Verify native build provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for file in dist/unsigned-native-agent-candidate/commandcore-agent-linux-arm64 dist/unsigned-native-agent-candidate/UNSIGNED_BUILD_METADATA.json; do
            gh attestation verify "$file" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/unsigned-linux-arm64-candidate.yml" \
              --source-ref refs/heads/main --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done
          echo 'NATIVE_BUILD_PROVENANCE=VERIFIED; RELEASE_SIGNATURE=NOT_PERFORMED'
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: unsigned-linux-arm64-agent-review-candidate
          path: dist/unsigned-native-agent-candidate/
          if-no-files-found: error
          retention-days: 14
