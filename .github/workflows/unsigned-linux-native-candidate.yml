name: Unsigned Linux x86_64 Agent review candidate

on:
  workflow_dispatch:
  # A one-time source-pinned build when the reviewed packaging workflow lands.
  # Rebuild after version/package or packaging changes; other commits do not
  # create expensive native candidates. Manual dispatch remains available.
  push:
    branches: [main]
    paths:
      - '.github/workflows/unsigned-linux-native-candidate.yml'
      - 'scripts/package_unsigned_native_candidate.py'
      - 'tests/test_package_unsigned_native_candidate.py'
      - 'VERSION'
      - 'agent/rust/Cargo.toml'
      - 'agent/rust/Cargo.lock'
      - 'scripts/rust_agent_smoke.py'

permissions:
  contents: read

jobs:
  unsigned-linux-candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate source identity and package version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import pathlib, tomllib
          root = pathlib.Path(".")
          package = tomllib.loads((root / "agent/rust/Cargo.toml").read_text())
          assert (root / "VERSION").read_text().strip() == package["package"]["version"]
          PY
      - name: Rust toolchain and native locked release build
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          cargo test --locked --manifest-path agent/rust/Cargo.toml
          cargo build --locked --release --manifest-path agent/rust/Cargo.toml
      - name: Native Agent black-box core acceptance (ephemeral localhost)
        shell: bash
        env:
          PYTHONPATH: apps/server:agent
          COMMANDCORE_RUST_AGENT_BIN: ${{ github.workspace }}/agent/rust/target/release/commandcore-agent-rust
        run: |
          set -euo pipefail
          python -m pip install -r requirements-dev.txt . ./agent
          python scripts/rust_agent_smoke.py
      - name: Produce and independently verify unsigned build evidence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/package_unsigned_native_candidate.py prepare \
            --binary agent/rust/target/release/commandcore-agent-rust \
            --cargo-lock agent/rust/Cargo.lock \
            --output dist/unsigned-native-agent-candidate \
            --source-sha "$GITHUB_SHA" \
            --version "$(cat VERSION)" \
            --rustc-version "$(rustc --version)" \
            --cargo-version "$(cargo --version)"
          python scripts/package_unsigned_native_candidate.py verify \
            --output dist/unsigned-native-agent-candidate \
            --source-sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@v7
        with:
          name: unsigned-linux-x86_64-agent-review-candidate
          path: dist/unsigned-native-agent-candidate/
          if-no-files-found: error
          retention-days: 14

  unsigned-linux-disposable-install:
    # Ubuntu 22.04 builds binaries with a GLIBC <=2.36 compatibility ceiling;
    # use Ubuntu 24.04 for the real installer (curl >=8.4, glibc >=2.36).
    needs: unsigned-linux-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-linux-x86_64-agent-review-candidate
          path: dist/unsigned-native-agent-candidate
      - name: Clean install exact CI binary with an ephemeral test-only key
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/native_linux_disposable_install.py \
            --candidate dist/unsigned-native-agent-candidate \
            --expected-source-sha "$GITHUB_SHA"
          echo 'CLEAN_INSTALL_TEST_KEY_ONLY=PASS'
          echo 'SIGNED_PRODUCTION_INSTALL_UPDATE_ROLLBACK=NOT_VERIFIED'
          echo 'PUBLICATION=NOT_PERFORMED'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Native Agent installer rollback and identity preservation (disposable)
        shell: bash
        env:
          COMMANDCORE_TEST_NATIVE_BINARY: ${{ github.workspace }}/dist/unsigned-native-agent-candidate/commandcore-agent-linux-x86_64
        run: |
          set -euo pipefail
          python -m pip install 'cryptography>=42,<51'
          python scripts/package_unsigned_native_candidate.py verify \
            --output dist/unsigned-native-agent-candidate \
            --source-sha "$GITHUB_SHA"
          # Runs as root only on an ephemeral GitHub runner. The harness drops
          # the installer to uid 65534 and uses fixture systemctl/loginctl.
          # It does not contact production, enroll, start services, or sign a
          # production release. No root operation on enrolled user devices.
          sudo --preserve-env=COMMANDCORE_TEST_NATIVE_BINARY \
            "$(command -v python)" scripts/installer_smoke.py
          echo 'FIXTURE_SERVICE_FAILURE_ROLLBACK_AND_IDENTITY=PASS'
          echo 'REAL_NATIVE_INSTALL_VERSION_UNINSTALL=PASS'
          echo 'CONNECTED_SERVICE_UPGRADE_ROLLBACK=NOT_VERIFIED'
