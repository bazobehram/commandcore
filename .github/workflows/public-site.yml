name: Public site build
on:
  pull_request:
    paths:
      - 'deploy/public/**'
      - 'scripts/build_public_site.py'
      - 'apps/workspace-angular/**'
      - 'docs/**'
      - '.github/workflows/public-site.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/public/**'
      - 'scripts/build_public_site.py'
      - 'apps/workspace-angular/**'
      - 'docs/**'
      - '.github/workflows/public-site.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/workspace-angular/package-lock.json
      - run: npm ci
        working-directory: apps/workspace-angular
      - run: npm run build
        working-directory: apps/workspace-angular
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'Markdown==3.9'
      - run: python scripts/build_public_site.py
      - run: |
          test -s dist/public-site/index.html
          test -s dist/public-site/app/index.html
          test -s dist/public-site/workspace/index.html
          test -s dist/public-site/site/landing.css
          test -s dist/public-site/site/landing.js
          test -s dist/public-site/docs/index.html
          test -s dist/public-site/docs/SELF_HOSTING.html
          test -n "$(find dist/public-site/app -name 'main-*.js' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: commandcore-public-site
          path: dist/public-site/
          retention-days: 14
          if-no-files-found: error
