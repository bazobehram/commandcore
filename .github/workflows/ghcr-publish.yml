name: Publish CommandCore image to GHCR
on:
  push:
    branches: [main]
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  workspace:
    if: github.repository == 'bazobehram/commandcore' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: apps/workspace-angular/package-lock.json
      - run: npm ci
        working-directory: apps/workspace-angular
      - run: npm run test:api && npm run test:unit && npm run build
        working-directory: apps/workspace-angular
      - name: Package the reviewed Workspace build
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/package_workspace_release.py \
            --root apps/workspace-angular/dist/commandcore-workspace/browser \
            --output "$RUNNER_TEMP/commandcore-workspace.zip" --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workspace-build-for-release
          path: ${{ runner.temp }}/commandcore-workspace.zip
          if-no-files-found: error
  publish:
    needs: workspace
    if: github.repository == 'bazobehram/commandcore' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment: ghcr-publish
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Validate reviewed source ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "branch" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]]
          else
            [[ "$GITHUB_REF_TYPE" == "tag" ]]
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Verify release checks
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/mcp_release_gate.py
          make test
      - name: Verify release artifact policy
        run: |
          git archive --format=zip HEAD > "$RUNNER_TEMP/release-source.zip"
          python scripts/release_check.py "$RUNNER_TEMP/release-source.zip"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=sha,format=long
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
      - name: Record immutable image reference
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ steps.build.outputs.digest }}" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf "image=ghcr.io/%s@%s\n" "${GITHUB_REPOSITORY,,}" "${{ steps.build.outputs.digest }}" > "$RUNNER_TEMP/commandcore-image.txt"
      - name: Verify published image revision and source labels
        shell: bash
        env:
          RELEASE_IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$RELEASE_IMAGE"
          image_id="$(docker image inspect --format '{{.Id}}' "$RELEASE_IMAGE")"
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$RELEASE_IMAGE")"
          source="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' "$RELEASE_IMAGE")"
          python scripts/verify_image_identity.py \
            --expected-commit "$GITHUB_SHA" \
            --image-id "$image_id" \
            --revision "$revision" \
            --source "$source"
          printf 'source_ref=%s\n' "$GITHUB_REF" >> "$RUNNER_TEMP/commandcore-image.txt"
          printf 'source_commit=%s\n' "$GITHUB_SHA" >> "$RUNNER_TEMP/commandcore-image.txt"
          printf 'image_id=%s\n' "$image_id" >> "$RUNNER_TEMP/commandcore-image.txt"
      - name: Verify immutable server code and packaged MCP UI bytes
        shell: bash
        env:
          RELEASE_IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          image_id="$(docker image inspect --format '{{.Id}}' "$RELEASE_IMAGE")"
          candidate="$(docker run --rm -d --network none --read-only --no-healthcheck --entrypoint python "$RELEASE_IMAGE" -c 'import time; time.sleep(120)')"
          trap 'docker stop "$candidate" >/dev/null' EXIT
          python scripts/runtime_release_parity.py \
            --container "$candidate" --source-root . \
            --expected-image-id "$image_id" > "$RUNNER_TEMP/runtime-release-parity.json"
          cat "$RUNNER_TEMP/runtime-release-parity.json"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: workspace-build-for-release
          path: ${{ runner.temp }}/workspace-release
      - name: Bind the Workspace artifact to the image identity
        shell: bash
        run: |
          set -euo pipefail
          workspace="$RUNNER_TEMP/workspace-release/commandcore-workspace.zip"
          test -s "$workspace"
          python -c 'import json, sys, zipfile; z = zipfile.ZipFile(sys.argv[1]); m = json.loads(z.read("WORKSPACE_RELEASE.json")); assert m["source_commit"] == sys.argv[2] and z.testzip() is None' "$workspace" "$GITHUB_SHA"
          printf 'workspace_sha256=%s\n' "$(sha256sum "$workspace" | cut -d' ' -f1)" >> "$RUNNER_TEMP/commandcore-image.txt"
      - name: Attest Workspace and shared release identity
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            ${{ runner.temp }}/workspace-release/commandcore-workspace.zip
            ${{ runner.temp }}/commandcore-image.txt
          create-storage-record: false
      - name: Verify Workspace and shared identity provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for file in "$RUNNER_TEMP/workspace-release/commandcore-workspace.zip" "$RUNNER_TEMP/commandcore-image.txt"; do
            gh attestation verify "$file" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ghcr-publish.yml" \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done
      - name: Generate signed GitHub provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false # Personal repository; avoid linked-artifact storage requirement
      - name: Verify signed provenance for exact image digest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://${RELEASE_IMAGE}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ghcr-publish.yml" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: commandcore-image-digest
          path: |
            ${{ runner.temp }}/commandcore-image.txt
            ${{ runner.temp }}/runtime-release-parity.json
            ${{ runner.temp }}/workspace-release/commandcore-workspace.zip
