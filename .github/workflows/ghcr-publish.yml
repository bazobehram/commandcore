name: Publish CommandCore image to GHCR
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ghcr-publish
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate release tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_TYPE" == "tag" ]]
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Verify release checks
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/mcp_release_gate.py
          make test
          make session-security-gate
      - name: Verify release artifact policy
        run: |
          git archive --format=zip HEAD > "$RUNNER_TEMP/release-source.zip"
          python scripts/release_check.py "$RUNNER_TEMP/release-source.zip"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=sha,format=long
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
      - name: Record immutable image reference
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ steps.build.outputs.digest }}" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf "image=ghcr.io/%s@%s\n" "${GITHUB_REPOSITORY,,}" "${{ steps.build.outputs.digest }}" > "$RUNNER_TEMP/commandcore-image.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: commandcore-image-digest
          path: ${{ runner.temp }}/commandcore-image.txt
