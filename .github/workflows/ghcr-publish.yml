name: Publish CommandCore image to GHCR
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ghcr-publish
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Validate release tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_TYPE" == "tag" ]]
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Verify release checks
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/mcp_release_gate.py
          make test
      - name: Verify release artifact policy
        run: |
          git archive --format=zip HEAD > "$RUNNER_TEMP/release-source.zip"
          python scripts/release_check.py "$RUNNER_TEMP/release-source.zip"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=sha,format=long
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
      - name: Generate signed GitHub provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false # Personal repository; avoid linked-artifact storage requirement
      - name: Verify signed provenance for exact image digest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://${RELEASE_IMAGE}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ghcr-publish.yml" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners
      - name: Record immutable image reference
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ steps.build.outputs.digest }}" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf "image=ghcr.io/%s@%s\n" "${GITHUB_REPOSITORY,,}" "${{ steps.build.outputs.digest }}" > "$RUNNER_TEMP/commandcore-image.txt"
      - name: Verify published image revision and source labels
        shell: bash
        env:
          RELEASE_IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$RELEASE_IMAGE"
          image_id="$(docker image inspect --format '{{.Id}}' "$RELEASE_IMAGE")"
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$RELEASE_IMAGE")"
          source="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' "$RELEASE_IMAGE")"
          python scripts/verify_image_identity.py \
            --expected-commit "$GITHUB_SHA" \
            --image-id "$image_id" \
            --revision "$revision" \
            --source "$source"
          printf 'source_commit=%s\n' "$GITHUB_SHA" >> "$RUNNER_TEMP/commandcore-image.txt"
          printf 'image_id=%s\n' "$image_id" >> "$RUNNER_TEMP/commandcore-image.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: commandcore-image-digest
          path: ${{ runner.temp }}/commandcore-image.txt
