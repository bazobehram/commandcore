name: Publish CommandCore image to GHCR
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ghcr-publish
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Validate release tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_TYPE" == "tag" ]]
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Verify release checks
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/mcp_release_gate.py
          make test
      - name: Verify release artifact policy
        run: |
          git archive --format=zip HEAD > "$RUNNER_TEMP/release-source.zip"
          python scripts/release_check.py "$RUNNER_TEMP/release-source.zip"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=sha,format=long
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
      - name: Record immutable image reference
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ steps.build.outputs.digest }}" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf "image=ghcr.io/%s@%s\n" "${GITHUB_REPOSITORY,,}" "${{ steps.build.outputs.digest }}" > "$RUNNER_TEMP/commandcore-image.txt"
      - name: Verify published image revision and source labels
        shell: bash
        env:
          RELEASE_IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$RELEASE_IMAGE"
          image_id="$(docker image inspect --format '{{.Id}}' "$RELEASE_IMAGE")"
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$RELEASE_IMAGE")"
          source="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' "$RELEASE_IMAGE")"
          python scripts/verify_image_identity.py \
            --expected-commit "$GITHUB_SHA" \
            --image-id "$image_id" \
            --revision "$revision" \
            --source "$source"
          printf 'source_commit=%s\n' "$GITHUB_SHA" >> "$RUNNER_TEMP/commandcore-image.txt"
          printf 'image_id=%s\n' "$image_id" >> "$RUNNER_TEMP/commandcore-image.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: commandcore-image-digest
          path: ${{ runner.temp }}/commandcore-image.txt
