name: Publish verified native Agent
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Actions run ID containing the externally signed release bundle
        required: true
        type: string
      version:
        description: Version in signed manifest (e.g. 0.9.0-rc8)
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: agent-release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install cryptography
      - name: Retrieve externally signed release bundle
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          run-id: ${{ inputs.source_run_id }}
          name: native-agent-signed-release
          path: signed-release
          github-token: ${{ github.token }}
      - name: Verify signed release before publication
        env:
          RELEASE_PUBLIC_KEY: ${{ vars.AGENT_RELEASE_PUBLIC_KEY_B64 }}
          RELEASE_VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          test -n "$RELEASE_PUBLIC_KEY"
          # Public Linux release must cover both architectures from one signed manifest.
          # The verifier checks the signature and all artifact bytes each time.
          for architecture in x86_64 arm64; do
            python scripts/verify_native_agent_release.py signed-release \
              --public-key-b64 "$RELEASE_PUBLIC_KEY" \
              --version "$RELEASE_VERSION" --repo "$REPOSITORY" \
              --architecture "$architecture"
          done
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          TAG="agent-v${RELEASE_VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite"
            exit 1
          fi
          mapfile -t ASSETS < <(python - <<'PYASSETS'
          import json
          from pathlib import Path
          root=Path('signed-release')
          manifest=json.loads((root/'manifest.signed.json').read_text())
          for item in manifest['artifacts']:
              print(root/item['filename'])
          print(root/'manifest.signed.json')
          PYASSETS
          )
          gh release create "$TAG" "${ASSETS[@]}" \
            --title "CommandCore Agent ${RELEASE_VERSION}" \
            --notes "Signed native Linux agent prerelease." --prerelease
