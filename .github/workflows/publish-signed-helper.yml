name: Publish verified Linux privileged helper
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Actions run containing externally signed helper assets
        required: true
        type: string
      version:
        description: Version of the signed helper (e.g. 0.9.0-rc8)
        required: true
        type: string
      architecture:
        description: Signed Linux helper architecture
        required: true
        type: choice
        options:
          - x86_64
          - arm64
      python_minor:
        description: Target Python runtime for the offline helper wheelhouse
        required: true
        type: choice
        options:
          - '3.11'
          - '3.12'
          - '3.13'
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-helper-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: agent-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install cryptography packaging
      - name: Retrieve externally signed bundle
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ inputs.source_run_id }}
          name: linux-helper-signed-release
          path: signed-helper
          github-token: ${{ github.token }}
      - name: Verify signed helper AND complete offline dependencies
        env:
          RELEASE_PUBLIC_KEY: ${{ vars.AGENT_RELEASE_PUBLIC_KEY_B64 }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_ARCH: ${{ inputs.architecture }}
          RELEASE_PYTHON: ${{ inputs.python_minor }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_PUBLIC_KEY"
          python scripts/verify_helper_publication.py \
            --root signed-helper \
            --version "$RELEASE_VERSION" \
            --architecture "$RELEASE_ARCH" \
            --python-minor "$RELEASE_PYTHON" \
            --trusted-public-key-b64 "$RELEASE_PUBLIC_KEY"
      - name: Publish immutable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_ARCH: ${{ inputs.architecture }}
          RELEASE_PYTHON: ${{ inputs.python_minor }}
        run: |
          set -euo pipefail
          tag="helper-v${RELEASE_VERSION}-${RELEASE_ARCH}-py${RELEASE_PYTHON//./}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Existing helper release; refusing overwrite" >&2
            exit 1
          fi
          shopt -s nullglob
          assets=(signed-helper/manifest.signed.json
                  signed-helper/commandcore-helper-linux-${RELEASE_ARCH}.tar.gz
                  signed-helper/wheels/*.whl)
          if (( ${#assets[@]} < 3 )); then
            echo "Missing signed offline wheelhouse assets" >&2
            exit 1
          fi
          # Keep any partial upload private; never expose incomplete root-capable
          # payloads. A failed upload leaves a draft for explicit operator review.
          gh release create "$tag" "${assets[@]}" \
            --title "CommandCore Linux helper ${RELEASE_VERSION}" \
            --notes "Externally signed helper and complete signed offline dependencies. Local Linux administrator approval remains mandatory." \
            --prerelease --draft
          gh release edit "$tag" --draft=false
