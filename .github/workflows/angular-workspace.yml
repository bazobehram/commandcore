name: Angular workspace build

on:
  pull_request:
    paths:
      - 'apps/workspace-angular/**'
      - '.github/workflows/angular-workspace.yml'
  push:
    branches: [main]
    paths:
      - 'apps/workspace-angular/**'
      - '.github/workflows/angular-workspace.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  angular-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/workspace-angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/workspace-angular/package-lock.json
      - run: npm ci
      - run: python3 -m pip install Pillow
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: commandcore-workspace-dist
          path: apps/workspace-angular/dist/commandcore-workspace/browser
          if-no-files-found: error
