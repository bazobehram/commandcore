name: Angular workspace build

on:
  pull_request:
    paths:
      - 'apps/workspace-angular/**'
      - 'tests/ui/workspace_mobile_smoke.cjs'
      - 'tests/ui/package.json'
      - 'tests/ui/package-lock.json'
      - '.github/workflows/angular-workspace.yml'
  push:
    branches: [main]
    paths:
      - 'apps/workspace-angular/**'
      - 'tests/ui/workspace_mobile_smoke.cjs'
      - 'tests/ui/package.json'
      - 'tests/ui/package-lock.json'
      - '.github/workflows/angular-workspace.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  angular-build:
    # Playwright 1.56.1 does not support the ubuntu-26.04 runner image yet.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/workspace-angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/workspace-angular/package-lock.json
      - run: npm ci
      - run: npm run test:api
      - run: npm run test:unit
      - run: npm run build
      - name: Install headless browser test dependencies
        run: npm ci
        working-directory: tests/ui
      - name: Install Chromium for mobile viewport acceptance
        run: npx playwright install --with-deps chromium
        working-directory: tests/ui
      - name: Check workspace at mobile and desktop viewports
        run: node tests/ui/workspace_mobile_smoke.cjs
        working-directory: .
      - uses: actions/upload-artifact@v4
        with:
          name: commandcore-workspace-dist
          path: apps/workspace-angular/dist/commandcore-workspace/browser
          if-no-files-found: error
