<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc"><title id="title">CommandCore architecture</title><desc id="desc">AI clients connect using MCP and OAuth to CommandCore, which authorizes and routes operations to enrolled devices.</desc><style>
